<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reflex Sprint - A collaborative sprint planning and tracking application" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reflex Sprint" />
    <meta property="og:description" content="Reflex Sprint - A collaborative sprint planning and tracking application" />

    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://your-domain.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Reflex Sprint - A collaborative sprint planning and tracking application" />

    <!-- Favicon -->

    <!-- Preconnect for performance (add external domains if needed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>Reflex Sprint</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="padding: 1rem; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
